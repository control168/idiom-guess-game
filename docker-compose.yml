services:
  postgres:
    image: postgres:16-alpine
    container_name: idiom-guess-game-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: idiom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idiom_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
